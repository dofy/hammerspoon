<!-- Kaon Router console favicon, background removed: a menu-bar icon is a
     template image, so macOS tints the alpha mask to the current foreground
     colour and the icon follows light/dark mode by itself. Any fill colour
     here is therefore ignored while `iconTemplate = true`. The violet
     #7C3AED plate of the original favicon is deliberately not reproduced. -->
<!-- viewBox is cropped to the artwork's bounding box (x 10..22, y 9..23) plus
     a pixel of padding, squared off around the centre node, instead of the
     favicon's 0 0 32 32. The plate is gone, so that 32-unit box left the
     shapes at half scale inside a 16pt menu-bar item and they turned to mush.
     A non-square box would be stretched: the host sets an equal width and
     height on the image. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 8 16 16" fill="none">
  <circle cx="12" cy="11" r="2" fill="#000"/>
  <circle cx="20" cy="11" r="2" fill="#000"/>
  <circle cx="12" cy="21" r="2" fill="#000"/>
  <circle cx="20" cy="21" r="2" fill="#000"/>
  <circle cx="16" cy="16" r="3" fill="#000"/>
  <line x1="14" y1="11" x2="14.5" y2="14" stroke="#000" stroke-width="1" stroke-linecap="round"/>
  <line x1="18" y1="11" x2="17.5" y2="14" stroke="#000" stroke-width="1" stroke-linecap="round"/>
  <line x1="14" y1="21" x2="14.5" y2="18" stroke="#000" stroke-width="1" stroke-linecap="round"/>
  <line x1="18" y1="21" x2="17.5" y2="18" stroke="#000" stroke-width="1" stroke-linecap="round"/>
</svg>
